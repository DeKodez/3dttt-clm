<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Agent Arena — 3D Tic-Tac-Toe</title>
  <link rel="stylesheet" href="/static/style.css" />
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.170.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.170.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <canvas id="scene"></canvas>

  <header class="hud top-left panel">
    <div class="title">AGENT ARENA <span class="dim">· 3D TIC-TAC-TOE</span></div>
    <div id="matchup" class="matchup">random vs tactical</div>
    <div class="scoreline">
      <span id="score-x" class="score x">0</span>
      <span class="score-sep">:</span>
      <span id="score-o" class="score o">0</span>
    </div>
    <div class="subline">
      <span id="turn-chip" class="chip x">X to move</span>
      <span id="game-counter" class="dim"></span>
    </div>
  </header>

  <aside id="controls" class="hud top-right panel">
    <div class="field">
      <label for="agent-a">Agent X (first)</label>
      <select id="agent-a"></select>
    </div>
    <div class="field">
      <label for="agent-b">Agent O</label>
      <select id="agent-b"></select>
    </div>
    <div class="field row">
      <label for="games">Games</label>
      <input id="games" type="number" min="1" max="50" value="4" />
      <label for="seed">Seed</label>
      <input id="seed" type="number" value="7" />
    </div>
    <div class="field">
      <label>Pace</label>
      <div class="speed-row" id="speed-row">
        <button data-delay="0.8" class="speed active">Watch</button>
        <button data-delay="0.15" class="speed">Fast</button>
        <button data-delay="0" class="speed">Turbo</button>
      </div>
    </div>
    <button id="start" class="start">Start match</button>
    <div class="conn"><span id="conn-dot" class="dot"></span><span id="conn-text">connecting…</span></div>
  </aside>

  <section class="hud bottom panel">
    <table id="stats-table">
      <thead>
        <tr><th>Agent</th><th>W–L–D</th><th>Win%</th><th>p50</th><th>p95</th><th>Invalid</th><th>Err</th></tr>
      </thead>
      <tbody></tbody>
    </table>
    <div class="chart-col">
      <div class="chart-label">Decision latency (ms)</div>
      <canvas id="latency" width="360" height="76"></canvas>
    </div>
  </section>

  <div id="banner" class="banner hidden">
    <div class="banner-title"></div>
    <div class="banner-sub"></div>
  </div>
  <div id="error" class="error hidden"></div>
  <div class="legend"><span class="key x">✕ Jev-side</span><span class="key o">◯ opponent</span></div>

  <script type="module" src="/static/app.js"></script>
</body>
</html>
